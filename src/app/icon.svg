  <line x1="14.5" y1="6.8" x2="14.5" y2="9.2" stroke="#ffffff" stroke-width="1.25" stroke-linecap="round" />
  <line x1="14.5" y1="19.8" x2="14.5" y2="22.2" stroke="#ffffff" stroke-width="1.25" stroke-linecap="round" />
  <line x1="6.8" y1="14.5" x2="9.2" y2="14.5" stroke="#ffffff" stroke-width="1.25" stroke-linecap="round" />
  <line x1="19.8" y1="14.5" x2="22.2" y2="14.5" stroke="#ffffff" stroke-width="1.25" stroke-linecap="round" />
  <!-- Optical Lens Handle -->
  <path d="M18.8 18.8 L23.5 23.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
